[package]
name = "ramoso"
version = "0.1.0"
description = "A Git client that makes every action visible, previewable and undoable"
license = "MIT OR Apache-2.0"
edition = "2024"

# `_lib` keeps the library name apart from the binary's (a Windows linker clash).
[lib]
name = "ramoso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
