<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ramoso app icon, from the design's brand mark screen ("App icon"), scaled 128 px -> 1024 px. -->
  <defs>
    <!-- CSS linear-gradient(160deg, #166534 0%, #0b3b20 55%, #052e16 100%) on a square. -->
    <linearGradient id="canopy" x1="0.281" y1="-0.102" x2="0.719" y2="1.102">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="0.55" stop-color="#0b3b20"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="230.4"/>
    </clipPath>
  </defs>

  <!-- Tile. -->
  <rect width="1024" height="1024" rx="230.4" fill="url(#canopy)"/>

  <!-- Top highlight: tile minus the tile moved down 8 px (inset 0 1px 0 rgba(255,255,255,.10)). -->
  <path clip-path="url(#tile)" fill="#ffffff" fill-opacity="0.10" fill-rule="evenodd"
        d="M0 0H1024V1024H0Z M0 238.4A230.4 230.4 0 0 1 230.4 8H793.6A230.4 230.4 0 0 1 1024 238.4V1032H0Z"/>

